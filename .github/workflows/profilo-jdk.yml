name: Profilo e JDK

# Prova di un giorno (4 novembre 2026): la 0.1.58 compilata come F-Droid (OpenJDK 21) ha nel profilo ART una regola in
# meno della release (Temurin 17): il costruttore che R8 crea fondendo classi. Primo giro: compilata da capo come la
# release, senza la cache di Gradle, con JDK 17 e 21 dà il profilo di F-Droid (contenuto 6d5244dce4d8a8fc): non è il JDK.
# Secondo giro: tre build uguali a quella della release (Temurin 17, la cache di Gradle di setup-gradle accesa), per
# vedere se il profilo della release (e09c2f47c06caf25) esce a volte. Da togliere dopo.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/profilo-jdk.yml"]

jobs:
  compila:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [17]
        giro: [1, 2, 3]
    env:
      VERSION: "0.1.58"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: La release
        run: |
          cp .github/scripts/profilo.py /tmp/
          git checkout -q "v$VERSION"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          cache-read-only: true
      - name: Compila come la release
        run: gradle :app:assembleRelease --no-daemon --stacktrace -q
      - name: Confronta il profilo
        run: |
          curl -sSfL -o signed.apk "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Xonos.apk"
          java -version 2>&1 | head -n 1
          python3 /tmp/profilo.py signed.apk app/build/outputs/apk/release/app-release-unsigned.apk breve
          find app/build/intermediates -type f -name 'baseline-prof.txt' -path '*art_profile*' \
            -exec sh -c 'printf "%s %s righe %s\n" "$(sha256sum "$1" | cut -c1-16)" "$(wc -l < "$1")" "$1"' _ {} \; | sort -k3
          grep -n 'LazyKt__LazyJVMKt;-><init>' app/build/intermediates/r8_art_profile/release/minifyReleaseWithR8/baseline-prof.txt || echo "regola del costruttore fuso: assente"
