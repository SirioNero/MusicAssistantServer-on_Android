name: Riproducibile

# Compila Xonos come lo compila F-Droid (la stessa immagine Docker e lo stesso JDK delle prove di
# fdroiddata, senza tools/ e server/ e senza chiave) e confronta l'APK con quello firmato della release: se è
# identico a parte la firma, F-Droid può pubblicare l'APK con la nostra firma (build riproducibili),
# e chi passa da GitHub/Obtainium a F-Droid non deve disinstallare. Parte a mano, o quando cambia
# questo file su un ramo claude/**.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/riproducibile.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versione della release da confrontare (vuoto = quella del sorgente)"
        type: string
        default: ""

jobs:
  confronta:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
    env:
      ANDROID_HOME: /opt/android-sdk
    steps:
      - name: Prepara come il buildserver di F-Droid
        run: |
          apt-get update -q
          # make, gawk e binutils per proot (app/native/proot.sh). Il suo GNUmakefile scrive loader/loader-info.c
          # con "readelf -s loader | awk -f loader-info.awk": lo script usa strtonum, che mawk di Debian non ha, e
          # readelf è quello di binutils. Senza readelf non si ferma: per arm64 l'offset di pokedata_workaround
          # diventa 0 (libproot.so diverso e sbagliato). Nella ricetta vanno nel campo sudo.
          apt-get install -qy --no-install-recommends openjdk-21-jdk-headless git curl unzip python3 make gawk binutils
          update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java
          java -version

      - name: Scarica il repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Versione e commit
        run: |
          git config --global --add safe.directory "$PWD"
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          # Lo script del confronto è di questo ramo: la release può essere più vecchia.
          cp .github/scripts/senza_firma.py .github/scripts/profilo.py /tmp/
          # Un push su un ramo claude/ con la versione nuova non ha ancora la sua release: niente da confrontare.
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Nessuna release v$VERSION: niente da confrontare (lancialo a mano con una versione uscita)."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git checkout -q "v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release v$VERSION, commit $(git rev-parse HEAD)"

      - name: NDK (come "ndk:" nella ricetta)
        if: env.SKIP != '1'
        run: |
          # Dalla 0.1.49 l'APK ha proot, compilato con l'NDK scritto in app/build.gradle.kts (ndkVersion).
          NDK=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ -z "$NDK" ] || [ -f "$ANDROID_HOME/ndk/$NDK/source.properties" ]; then
            echo "NDK: ${NDK:-non serve}"
            exit 0
          fi
          # Gli archivi di Google hanno il nome della release (r27d), non il numero di versione.
          case "$NDK" in
            27.3.13750724) RELEASE=r27d ;;
            *) echo "::error title=NDK::Aggiungi qui la sigla r.. dell'NDK $NDK"; exit 1 ;;
          esac
          curl -sSfL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-$RELEASE-linux.zip"
          mkdir -p "$ANDROID_HOME/ndk"
          unzip -q /tmp/ndk.zip -d /tmp/ndk
          mv /tmp/ndk/android-ndk-$RELEASE "$ANDROID_HOME/ndk/$NDK"
          grep Pkg.Revision "$ANDROID_HOME/ndk/$NDK/source.properties"

      - name: Compila come F-Droid
        if: env.SKIP != '1'
        run: |
          rm -rf tools server
          # Come gradlew-fdroid: la versione di Gradle scritta in gradle-wrapper.properties.
          URL=$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | sed 's/\\:/:/g')
          echo "Gradle: $URL"
          curl -sSfL -o /tmp/gradle.zip "$URL"
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          GRADLE=$(ls -d /tmp/gradle/gradle-*)/bin/gradle
          cd app
          "$GRADLE" assembleRelease --no-daemon

      - name: Confronta con l'APK firmato della release
        if: env.SKIP != '1'
        run: |
          curl -sSfL -o signed.apk "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Xonos.apk"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          ls -l signed.apk "$UNSIGNED"
          # Il confronto che conta: l'APK della release senza il suo blocco di firma, byte per byte.
          python3 /tmp/senza_firma.py signed.apk stripped.apk
          if cmp stripped.apk "$UNSIGNED"; then
            echo "Byte per byte: identici, firma a parte."
          else
            echo "::error title=Non riproducibile::L'APK compilato come F-Droid è diverso da quello della release v$VERSION."
            mkdir -p diff/signed diff/fdroid
            unzip -q signed.apk -d diff/signed
            unzip -q "$UNSIGNED" -d diff/fdroid
            (cd diff/signed && find . -type f -exec sha256sum {} + | sort -k2) > diff/signed.txt
            (cd diff/fdroid && find . -type f -exec sha256sum {} + | sort -k2) > diff/fdroid.txt
            diff diff/signed.txt diff/fdroid.txt || true
            zipinfo -v stripped.apk > diff/a.txt; zipinfo -v "$UNSIGNED" > diff/b.txt
            diff diff/a.txt diff/b.txt | head -n 80 || true
            # Il profilo ART (assets/dexopt/baseline.prof) è diverso con lo stesso codice dalla 0.1.58: cosa
            # cambia dentro, e se cambia anche fra due build di fila nello stesso ambiente.
            if ! cmp -s diff/signed/assets/dexopt/baseline.prof diff/fdroid/assets/dexopt/baseline.prof; then
              python3 /tmp/profilo.py signed.apk "$UNSIGNED" || true
              echo "Profili intermedi di questa build:"
              find app/build/intermediates -type f \( -name '*.txt' -path '*art_profile*' -o -name '*.prof' -o -name '*.profm' \) \
                -exec sh -c 'printf "%s %s righe %s\n" "$(sha256sum "$1" | cut -c1-16)" "$(wc -l < "$1")" "$1"' _ {} \; | sort -k3
              cp "$UNSIGNED" first.apk
              GRADLE=$(ls -d /tmp/gradle/gradle-*)/bin/gradle
              (cd app && "$GRADLE" assembleRelease --no-daemon --rerun-tasks -q) || true
              echo "Seconda build di fila nello stesso ambiente:"
              python3 /tmp/profilo.py first.apk "$UNSIGNED" breve || true
            fi
            exit 1
          fi
          # Quindi l'APK della release è questo più la sua firma: che la firma sia buona lo dice apksigner
          # dell'SDK. (apksigcopier di Debian cerca anche la firma v1, che con minSdk 26 non c'è.)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs signed.apk | grep -i "SHA-256"
          echo "Riproducibile: F-Droid può pubblicare l'APK con la firma della release v$VERSION."
